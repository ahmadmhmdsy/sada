name: تقرير خطأ / Bug report
description: أبلغ عن مشكلة في صدى (Sada) — Report a problem with the app
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        شكراً لوقتك! قبل الإرسال ابحث في [المشكلات المفتوحة](https://github.com/alshahia/sada/issues?q=is%3Aissue).
        اذكر إصدار صدى ونظام Windows وخطوات إعادة المشكلة.
        للأسئلة والاستخدام استخدم [المناقشات](https://github.com/alshahia/sada/discussions).

        Thanks for taking the time. Search existing issues first, and include the app version,
        Windows version and reproduction steps.
  - type: input
    id: version
    attributes:
      label: إصدار صدى / Sada version
      description: الإعدادات ← حول (Settings → About)
      placeholder: "3.2.2"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: إصدار Windows / Windows version
      options:
        - Windows 11
        - Windows 10
        - Other / أخرى
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: ماذا حدث؟ / What happened?
      description: ما فعلته، وما توقعته.
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: سجلات أو لقطات / Logs or screenshots
      description: يمكنك لصق السجلات أو إرفاق لقطات. لا تُرفق تسجيلات خاصة.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: تأكيدات / Checks
      options:
        - label: بحثت عن مشكلة مشابهة / I searched existing issues
          required: true
        - label: الإصدار هو أحدث إصدار عام / This is the latest public release
          required: false
