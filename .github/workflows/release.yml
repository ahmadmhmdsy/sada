name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v3.3.0). Defaults to the selected ref."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer and publish release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag, version and release notes
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the app version $VERSION in desktop/src-tauri/tauri.conf.json"
            exit 1
          fi
          NOTES="docs/releases/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing release notes: $NOTES"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          # The engine is a separate cargo workspace under server/.
          workspaces: |
            . -> target
            server -> target

      - name: Setup chore (sidecar fetcher)
        uses: getchore/setup-chore@v1
        with:
          version: v1.6.0

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Run unit tests before building
        working-directory: desktop
        run: pnpm test

      - name: Fetch the pinned sidecars (vibe-server + ffmpeg)
        run: chore setup x86_64-pc-windows-msvc

      # The installer must ship the guarded engine, not the upstream sidecar the setup step just
      # downloaded: server/ carries the loopback Host/Origin check (see SECURITY.md), and the
      # sidecar fetch does not build from source. This overwrites the binary in place.
      - name: Build the patched engine sidecar from server/
        shell: pwsh
        env:
          VIBE_SERVER_COMMIT: ${{ github.sha }}
        run: |
          $version = (Get-Content .server-version -Raw).Trim()
          $env:VIBE_SERVER_VERSION = "$version-sada.1"
          chore server-build x86_64-pc-windows-msvc

      - name: Test the engine request guard
        working-directory: server
        run: cargo test --release -p vibe-server guard::

      - name: Build the frontend once for the Rust test build
        working-directory: desktop
        run: pnpm build

      - name: Run Rust tests (MCP, Arabic normaliser, app)
        working-directory: desktop/src-tauri
        run: cargo test --release

      - name: Build the NSIS installer
        working-directory: desktop
        run: pnpm exec tauri build --bundles nsis

      - name: Collect release assets and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $candidates = @('target/release/bundle/nsis', 'desktop/src-tauri/target/release/bundle/nsis')
          $installer = Get-ChildItem -Path $candidates -Filter '*.exe' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced by tauri build' }
          Write-Output "Installer: $($installer.FullName)"
          Write-Output "Size: $($installer.Length) bytes"
          Copy-Item $installer.FullName release-assets/
          Copy-Item 'LICENSE', 'NOTICE', 'THIRD-PARTY-NOTICES.md' release-assets/
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          $line = "$hash  $($installer.Name)"
          Set-Content -Path 'release-assets/SHA256SUMS.txt' -Value $line -NoNewline
          Write-Output $line
          Get-ChildItem release-assets | Format-Table Name, Length -AutoSize | Out-String

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "صدى (Sada) ${{ steps.vars.outputs.version }}"
          body_path: ${{ steps.vars.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*

      - name: Summary
        shell: pwsh
        run: Get-Content release-assets/SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY
