name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v3.3.0). Defaults to the selected ref."
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer and publish release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag, version and release notes
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the app version $VERSION in desktop/src-tauri/tauri.conf.json"
            exit 1
          fi
          NOTES="docs/releases/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing release notes: $NOTES"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          # The engine is a separate cargo workspace under server/.
          workspaces: |
            . -> target
            server -> target

      - name: Setup chore (sidecar fetcher)
        uses: getchore/setup-chore@v1
        with:
          version: v1.6.0

      - name: Setup uv (only needed when signing is enabled)
        if: vars.SIGNING_ENABLED == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Run unit tests before building
        working-directory: desktop
        run: pnpm test

      - name: Fetch the pinned sidecars (vibe-server + ffmpeg)
        run: chore setup x86_64-pc-windows-msvc

      # The installer must ship the guarded engine, not the upstream sidecar the setup step just
      # downloaded: server/ carries the loopback Host/Origin check (see SECURITY.md), and the
      # sidecar fetch does not build from source. This overwrites the binary in place.
      - name: Build the patched engine sidecar from server/
        shell: pwsh
        env:
          VIBE_SERVER_COMMIT: ${{ github.sha }}
        run: |
          $version = (Get-Content .server-version -Raw).Trim()
          # The suffix separates rebuilds of one upstream version: 3.4.0 through 3.10.0 shipped
          # three distinct engines that all reported v0.6.16-sada.1, so 3.11.0 ships
          # v0.6.16-sada.2 and each installer's engine version stays unique.
          $env:VIBE_SERVER_VERSION = "$version-sada.2"
          chore server-build x86_64-pc-windows-msvc

      - name: Test the engine request guard
        working-directory: server
        run: "cargo test --release -p vibe-server guard::"

      - name: Build the frontend once for the Rust test build
        working-directory: desktop
        run: pnpm build

      - name: Run Rust tests (MCP, Arabic normaliser, app)
        working-directory: desktop/src-tauri
        run: cargo test --release

      - name: Resolve signing configuration
        id: signing
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
        run: |
          # The repository ships tauri.windows.signing.conf.json, a config overlay that wires
          # scripts/sign.py as bundle.windows.signCommand (YubiKey tunnel signer). It is only
          # merged into the build when signing is enabled, so an unsigned release never spawns
          # the signer and does not need uv. See docs/SIGNING.md for the switch-on procedure.
          if ($env:SIGNING_ENABLED -eq 'true') {
            "config=--config src-tauri/tauri.windows.signing.conf.json" >> $env:GITHUB_OUTPUT
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Output "signing: enabled (SignPath/Azure path replaces this overlay when approved)"
          } else {
            "config=" >> $env:GITHUB_OUTPUT
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Output "signing: disabled — publishing unsigned assets with SHA-256 checksums"
          }

      # Offline WebView2 variant: same app, NSIS embeds the WebView2 Evergreen installer so a
      # Windows 10 machine that has never run a modern app can install without network. The
      # small downloadBootstrapper installer stays the default asset.
      - name: Build the offline WebView2 installer variant (second asset)
        working-directory: desktop
        env:
          SIGN_ENABLED: ${{ vars.SIGNING_ENABLED }}
          SIGN_TUNNEL_URL: ${{ secrets.SIGN_TUNNEL_URL }}
          SIGN_TUNNEL_SECRET: ${{ secrets.SIGN_TUNNEL_SECRET }}
        run: >-
          pnpm exec tauri build --bundles nsis
          --config src-tauri/tauri.offline.conf.json
          ${{ steps.signing.outputs.config }}

      - name: Stage the offline installer as a separate asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $candidates = @('target/release/bundle/nsis', 'desktop/src-tauri/target/release/bundle/nsis')
          $offline = Get-ChildItem -Path $candidates -Filter '*.exe' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $offline) { throw 'the offline WebView2 installer was not produced by tauri build' }
          $target = "release-assets/Sada_${{ steps.vars.outputs.version }}_x64-setup-offline.exe"
          Copy-Item $offline.FullName $target
          Write-Output "offline installer: $($offline.Length) bytes -> $target"

      - name: Build the per-machine MSI (managed deployment)
        working-directory: desktop
        env:
          SIGN_ENABLED: ${{ vars.SIGNING_ENABLED }}
          SIGN_TUNNEL_URL: ${{ secrets.SIGN_TUNNEL_URL }}
          SIGN_TUNNEL_SECRET: ${{ secrets.SIGN_TUNNEL_SECRET }}
        run: >-
          pnpm exec tauri build --bundles msi
          --config src-tauri/tauri.enterprise.conf.json
          ${{ steps.signing.outputs.config }}

      - name: Stage the per-machine MSI as a separate asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $candidates = @('target/release/bundle/msi', 'desktop/src-tauri/target/release/bundle/msi')
          $msi = Get-ChildItem -Path $candidates -Filter '*.msi' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw 'the per-machine MSI was not produced by tauri build' }
          $target = "release-assets/Sada_${{ steps.vars.outputs.version }}_x64_en-US.msi"
          Copy-Item $msi.FullName $target
          Write-Output "MSI: $($msi.Length) bytes -> $target"

      - name: Build the NSIS installer
        working-directory: desktop
        env:
          SIGN_ENABLED: ${{ vars.SIGNING_ENABLED }}
          SIGN_TUNNEL_URL: ${{ secrets.SIGN_TUNNEL_URL }}
          SIGN_TUNNEL_SECRET: ${{ secrets.SIGN_TUNNEL_SECRET }}
        run: >-
          pnpm exec tauri build --bundles nsis
          ${{ steps.signing.outputs.config }}

      - name: Collect release assets and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $candidates = @('target/release/bundle/nsis', 'desktop/src-tauri/target/release/bundle/nsis')
          $installer = Get-ChildItem -Path $candidates -Filter '*.exe' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced by tauri build' }
          Write-Output "Installer: $($installer.FullName)"
          Write-Output "Size: $($installer.Length) bytes"
          Copy-Item $installer.FullName release-assets/
          $offline = "release-assets/Sada_${{ steps.vars.outputs.version }}_x64-setup-offline.exe"
          if (-not (Test-Path $offline)) { throw 'the offline installer asset was not staged' }
          $msi = "release-assets/Sada_${{ steps.vars.outputs.version }}_x64_en-US.msi"
          if (-not (Test-Path $msi)) { throw 'the per-machine MSI asset was not staged' }
          Copy-Item 'LICENSE', 'NOTICE', 'THIRD-PARTY-NOTICES.md' release-assets/
          $entries = @(
            @{ Path = $installer.FullName; Name = $installer.Name },
            @{ Path = $offline; Name = (Split-Path $offline -Leaf) },
            @{ Path = $msi; Name = (Split-Path $msi -Leaf) }
          )
          $lines = foreach ($entry in $entries) {
            $hash = (Get-FileHash $entry.Path -Algorithm SHA256).Hash
            "$hash  $($entry.Name)"
          }
          Set-Content -Path 'release-assets/SHA256SUMS.txt' -Value ($lines -join [char]10)
          $lines | ForEach-Object { Write-Output $_ }
          Write-Output "signing enabled: ${{ steps.signing.outputs.enabled }}"
          Get-ChildItem release-assets | Format-Table Name, Length -AutoSize | Out-String

      - name: Stage dependency lockfiles for the SBOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .sbom/app, .sbom/server, .sbom/npm | Out-Null
          Copy-Item Cargo.lock .sbom/app/Cargo.lock
          Copy-Item server/Cargo.lock .sbom/server/Cargo.lock
          Copy-Item desktop/pnpm-lock.yaml .sbom/npm/pnpm-lock.yaml
          Copy-Item desktop/package.json .sbom/npm/package.json
          Copy-Item .server-version .sbom/server-version.txt

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .sbom
          format: cyclonedx-json
          output-file: release-assets/sbom-cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Add bundled components to the SBOM
        shell: pwsh
        run: |
          $sidecar = (Get-Content .server-version -Raw).Trim() + '-sada.2'
          $ffmpeg = Get-ChildItem desktop/src-tauri/binaries -Filter 'ffmpeg-*.exe' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $ffmpegPath = if ($ffmpeg) { $ffmpeg.FullName } else { '' }
          ./scripts/generate-sbom.ps1 -SbomPath release-assets/sbom-cyclonedx.json -AppVersion '${{ steps.vars.outputs.version }}' -SidecarVersion $sidecar -FfmpegPath $ffmpegPath

      - name: Attest build provenance (keyless, Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          # Attest the checksum list too: SHA256SUMS.txt is generated on the runner, so its
          # contents inherit the same provenance as the installers they describe.
          subject-path: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/SHA256SUMS.txt
            release-assets/sbom-cyclonedx.json

      # Runs only when signing is enabled: an unsigned artifact must not reach the release page.
      - name: Verify Authenticode signatures
        if: vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $installers = Get-ChildItem release-assets -Filter '*.exe'
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($installer.Name) is not validly signed: $($signature.Status)"
            }
            Write-Output "$($installer.Name): $($signature.SignerCertificate.Subject)"
          }

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "صدى (Sada) ${{ steps.vars.outputs.version }}"
          body_path: ${{ steps.vars.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*

      - name: Summary
        shell: pwsh
        run: Get-Content release-assets/SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY
