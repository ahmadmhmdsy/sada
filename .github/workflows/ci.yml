name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop build & tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup chore (sidecar fetcher)
        uses: getchore/setup-chore@v1
        with:
          version: v1.6.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check, compile locales and bundle
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Fetch the pinned sidecars (vibe-server + ffmpeg)
        working-directory: .
        run: chore setup x86_64-pc-windows-msvc

      - name: Run Rust tests (MCP, Arabic normaliser, app)
        working-directory: desktop/src-tauri
        run: cargo test --release
