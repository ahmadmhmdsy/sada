name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop build & tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup chore (sidecar fetcher)
        uses: getchore/setup-chore@v1
        with:
          version: v1.6.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check, compile locales and bundle
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Fetch the pinned sidecars (vibe-server + ffmpeg)
        working-directory: .
        run: chore setup x86_64-pc-windows-msvc

      - name: Run Rust tests (MCP, Arabic normaliser, app)
        working-directory: desktop/src-tauri
        run: cargo test --release

  benchmarks:
    name: Arabic ASR benchmark harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run harness unit tests
        working-directory: benchmarks/arabic-asr
        run: python -m unittest discover -s tests -v

      # The regression gate cannot run a live model in CI, but it can be exercised on the
      # committed report: a self-comparison must pass with every delta at 0.00. A broken
      # compare command therefore fails on the next push instead of on a release day.
      - name: Regression gate smoke test on the committed report
        working-directory: benchmarks/arabic-asr
        run: >-
          python -m sadabench compare
          --baseline results/results-2026-11-18-v2.json
          --candidate results/results-2026-11-18-v2.json

  server:
    name: Server build & tests
    # Triage follow-up (docs/DEPENDABOT-TRIAGE.md): no job used to build server/, so a server
    # dependency bump could pass every PR check and break the next release -- which is exactly how
    # the utoipa-swagger-ui 10 / utoipa 5 mismatch (PR #44) reached a red build. This job closes that gap.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Check the server workspace
        run: cargo check --all-targets

      - name: Run server tests
        run: cargo test --release -p vibe-server
