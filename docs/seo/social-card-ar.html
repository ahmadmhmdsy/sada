<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Sada social card — Arabic (source for scripts/seo/build-share-assets.ps1; not deployed)</title>
<style>
  @font-face { font-family: "PlexAr"; src: url("../../site/assets/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "PlexAr"; src: url("../../site/assets/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype"); font-weight: 400; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 500px at 85% -10%, #175c55 0%, transparent 60%),
      radial-gradient(700px 400px at -5% 110%, #1c4b45 0%, transparent 55%),
      #0e1b1a;
    color: #f6f1e7;
    font-family: "PlexAr", "Segoe UI", Tahoma, sans-serif;
    display: flex; align-items: center; gap: 56px; padding: 58px 72px;
  }
  .copy { flex: 1; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
  .brand .logomark { width: 62px; height: 62px; flex: 0 0 auto; }
  .wordmark { font-size: 38px; font-weight: 700; letter-spacing: 0; line-height: 1; }
  h1 { font-size: 52px; line-height: 1.26; font-weight: 700; margin-bottom: 18px; }
  h1 .accent { color: #e9b44c; }
  p.sub { font-size: 25px; line-height: 1.5; color: #cfe3dd; margin-bottom: 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { border: 1px solid #2f5c56; background: rgba(255,255,255,0.04); color: #e9f3ef; border-radius: 999px; padding: 7px 16px; font-size: 18px; }
  .url { margin-top: 22px; font-size: 16px; color: #7fb3a9; direction: ltr; text-align: right; letter-spacing: .2px; }
  .shot { width: 430px; flex: 0 0 auto; border-radius: 16px; border: 1px solid #2c524d; box-shadow: 0 30px 80px -30px #000; overflow: hidden; background: #0b1514; }
  .shot img { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <svg class="logomark" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><rect width="1024" height="1024" rx="232" fill="#0E1B1A" stroke="#2f5c56" stroke-width="14"/><circle cx="404" cy="512" r="92" fill="#E9B44C"/><path d="M 560 380 A 186 186 0 0 1 560 644" fill="none" stroke="#E9B44C" stroke-width="60" stroke-linecap="round"/><path d="M 672 300 A 300 300 0 0 1 672 724" fill="none" stroke="#E9B44C" stroke-width="60" stroke-linecap="round" opacity="0.82"/><path d="M 784 220 A 414 414 0 0 1 784 804" fill="none" stroke="#E9B44C" stroke-width="60" stroke-linecap="round" opacity="0.55"/></svg>
      <div class="wordmark">صدى · Sada</div>
    </div>
    <h1>تفريغ صوتي عربي<br><span class="accent">على جهازك، بلا إنترنت</span></h1>
    <p class="sub">Whisper محلي · واجهة RTL · تصدير PDF عربي · لنظام Windows</p>
    <div class="chips">
      <span class="chip">Windows 10/11</span>
      <span class="chip">بدون قياسات</span>
      <span class="chip">رخصة MIT</span>
    </div>
    <div class="url">github.com/alshahia/sada</div>
  </div>
  <div class="shot"><img src="../../site/assets/sada-main.png" alt="" /></div>
</body>
</html>
